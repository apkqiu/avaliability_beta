# 编译vite网站
name: Vite

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with: 
          node-version: 24
        # with: node-version: 18

      - name: Install dependencies
        run: npm ci


      - name: Hack the build script
        # 修改node_modules/vite-ssg/dist/node/cli.mjs中的内容
        # 将const waitInSeconds = 15; 改为 const waitInSeconds = 0;
        run: sed -i 's/const waitInSeconds = 15;/const waitInSeconds = 0;/' node_modules/vite-ssg/dist/node/cli.mjs

      - name: Build
        run: npm run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          commit_message: Build by Github Actions
