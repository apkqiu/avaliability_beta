<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script type="module" src="/src/main.js" defer></script>
  </head>
  <body>
    <div id="app"></div>
    <script>
      window.onerror = function (msg, url, line, col, error) {
        msg = "发生错误：";
        msg += "消息: " + msg + '\n';
        msg += "文件: " + url + '\n';
        msg += "行号: " + (line+1) + '\n';
        msg += "列号: " + (col+1) + '\n';
        msg += "详细信息 " + error + '\n';
        alert(msg);
      }
    </script>
  </body>
</html>
